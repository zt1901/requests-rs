name: 多平台构建wheel

# 触发方式：手动触发（Actions页面），或推送 v 开头标签时自动构建并发布
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64：原生MSVC构建（本地已验证）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Linux x64：原生GCC构建
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Linux ARM64：x64机器上交叉编译（btls-sys自带aarch64工具链文件）
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          # macOS x64：macos-13是Intel机器，原生构建
          - os: macos-13
            target: x86_64-apple-darwin
          # macOS ARM64：macos-14是Apple Silicon机器，原生构建
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: 安装Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装Linux ARM64交叉编译工具链
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 安装maturin
        run: python -m pip install "maturin>=1.9,<2"

      - name: 构建wheel
        env:
          # 交叉编译时指定目标编译器（cmake-rs和cc-crate都会读取）
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          rustup target add ${{ matrix.target }}
          # 注意：CI不使用同步指纹.py（它依赖本机采集的fingerprint_records.json），
          # 直接用仓库内已提交的fingerprints.json构建。
          maturin build --release --target ${{ matrix.target }} --out dist

      - name: 冒烟测试（原生平台）
        if: "!matrix.cross"
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/requests_rust-*.whl
          python -c "from requests_rust import available_profiles; p = available_profiles(); assert len(p) > 0, p; print('smoke ok:', p)"

      - name: 上传wheel产物
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # 推送 v 标签时：汇总所有平台wheel并发布到GitHub Release
  release:
    name: 发布GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: 列出产物
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          draft: true
