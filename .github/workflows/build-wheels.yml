name: 多平台构建wheel

# 触发方式：手动触发（Actions页面），或推送 v 开头标签时自动构建并发布
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 wheel 由本机发布；Actions 仅构建 Windows ARM64。
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          # Linux x64：原生GCC构建
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Linux ARM64：原生ARM runner构建，避免宿主objcopy处理ARM归档。
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macOS Apple Silicon：使用ARM64原生runner构建和安装验证。
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: 安装Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装Linux BoringSSL构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev cmake perl pkg-config
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: 安装macOS BoringSSL构建依赖
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake perl pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: 定位Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin"
          )
          $path = $candidates | Where-Object { Test-Path (Join-Path $_ "libclang.dll") } | Select-Object -First 1
          if (-not $path) { throw "未找到libclang.dll" }
          "LIBCLANG_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 安装maturin
        run: python -m pip install "maturin>=1.9,<2"

      - name: 构建wheel
        run: |
          rustup target add ${{ matrix.target }}
          # 注意：CI不使用同步指纹.py（它依赖本机采集的fingerprint_records.json），
          # 直接用仓库内已提交的fingerprints.json构建。
          maturin build --release --target ${{ matrix.target }} --out dist

      - name: 冒烟测试（原生平台）
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/requests_rust-*.whl
          python -c "from requests_rust import AsyncSession, Session, available_profiles; p = available_profiles(); assert {'chrome146', 'chrome150', 'firefox151'} <= set(p), p; Session(impersonate='chrome146').close(); print('smoke ok:', p)"

      - name: 上传wheel产物
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # 推送 v 标签时：汇总所有平台wheel并发布到GitHub Release
  release:
    name: 发布GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: 列出产物
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          draft: true
