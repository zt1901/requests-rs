[package]
name = "requests_rust"
version = "0.4.10"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zt1901/requests-rs"
readme = "README.md"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
btls = { path = "vendor/btls-wrapper" }
brotli = "8"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
hickory-resolver = "0.26"
lru = "0.18.2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
pyo3 = { version = "0.29", features = ["abi3-py310", "bytes", "extension-module"] }
pyo3-async-runtimes = { version = "0.29", default-features = false, features = ["tokio-runtime"] }
quiche = { path = "vendor/quiche/quiche", default-features = true, features = ["custom-client-dcid"] }
rand = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
url = "2"
webpki-root-certs = "1"
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["tokio-rt", "cookies", "stream", "multipart", "gzip", "brotli", "zstd", "deflate", "socks", "ws"] }
zstd = "0.13"

[dev-dependencies]
quiche = { path = "vendor/quiche/quiche", default-features = true, features = ["internal", "custom-client-dcid"] }
http = "1"
http2 = { path = "vendor/http2" }

[target.'cfg(not(windows))'.dependencies]
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["tokio-rt", "cookies", "stream", "multipart", "gzip", "brotli", "zstd", "deflate", "socks", "ws"] }

[profile.release]
# Portable high-optimization release; avoid target-cpu=native in public wheels.
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true

[patch.crates-io]
http2 = { path = "vendor/http2" }
btls = { path = "vendor/btls-wrapper" }
btls-sys = { path = "vendor/btls/btls-sys" }
wreq = { path = "vendor/wreq" }
