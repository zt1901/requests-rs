[package]
name = "requests_rust"
version = "0.3.0"
edition = "2024"
license = "Proprietary"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
brotli = "8"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pyo3 = { version = "0.28", features = ["abi3-py310", "bytes", "extension-module"] }
pyo3-async-runtimes = { version = "0.28", default-features = false, features = ["tokio-runtime"] }
rand = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
url = "2"
webpki-root-certs = "1"
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["tokio-rt", "webpki-roots", "cookies", "stream", "multipart", "gzip", "brotli", "zstd", "deflate", "socks", "ws"] }
zstd = "0.13"

[dev-dependencies]
http = "1"
http2 = { path = "vendor/http2" }

[target.'cfg(not(windows))'.dependencies]
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["tokio-rt", "webpki-roots", "cookies", "stream", "multipart", "gzip", "brotli", "zstd", "deflate", "socks", "ws", "prefix-symbols"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[patch.crates-io]
http2 = { path = "vendor/http2" }
btls-sys = { path = "vendor/btls/btls-sys" }
